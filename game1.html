<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tense Slayer: 8-Bit Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #080808;
            --card-bg: #1a1a2e;
            --accent: #00ff41; /* Retro Matrix/Terminal Green */
            --text: #ffffff;
            --danger: #ff003c;
            --player-color: #00d4ff;
        }

        body {
            font-family: 'Press Start 2P', cursive; /* 8-bit Font */
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            /* Scanline effect for retro feel */
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
        }

        #game-container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border: 4px solid #fff;
            box-shadow: 10px 10px 0px #000;
            text-align: center;
            position: relative;
        }

        .hidden { display: none !important; }

        /* UI Elements */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.6rem;
        }

        .hp-container {
            width: 100%;
            background: #333;
            height: 15px;
            border: 2px solid #fff;
            margin: 5px 0;
        }

        .hp-fill { height: 100%; transition: width 0.3s ease; }
        #enemy-hp-fill { background-color: var(--danger); }
        #player-hp-fill { background-color: var(--player-color); }

        /* Screens */
        h1 { font-size: 1.2rem; color: var(--accent); margin-bottom: 30px; line-height: 1.5; }
        p { font-size: 0.7rem; line-height: 1.6; }

        button {
            font-family: 'Press Start 2P', cursive;
            background: #000;
            color: #fff;
            border: 3px solid #fff;
            padding: 15px;
            margin: 10px 0;
            width: 100%;
            cursor: pointer;
            font-size: 0.6rem;
            transition: transform 0.1s;
        }

        button:hover {
            background: var(--accent);
            color: #000;
            transform: scale(1.02);
        }

        button:active { transform: scale(0.98); }

        /* Battle Elements */
        #battle-log {
            font-size: 0.5rem;
            height: 40px;
            color: var(--accent);
            margin-bottom: 10px;
        }

        #dice-display {
            font-size: 1.5rem;
            margin-bottom: 20px;
            height: 30px;
        }

        .question-card {
            background: #000;
            border: 2px solid var(--accent);
            padding: 20px;
            margin-top: 10px;
        }

        .question-text {
            font-size: 0.7rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Animations */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-1deg); }
            40% { transform: translate(3px, 2px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(3px, 1px) rotate(-1deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
        .shake { animation: shake 0.3s; }

    </style>
</head>
<body>

<!-- Audio Elements -->
<!-- BGM: 8-bit loop from a public source -->
<audio id="bgm" loop>
    <source src="https://assets.mixkit.co/music/preview/mixkit-retro-game-8-bit-loop-2843.mp3" type="audio/mpeg">
</audio>
<!-- Sound Effects -->
<audio id="sfx-correct"><source src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-retro-game-win-2045.mp3" type="audio/mpeg"></audio>
<audio id="sfx-wrong"><source src="https://assets.mixkit.co/sfx/preview/mixkit-retro-game-lose-2044.mp3" type="audio/mpeg"></audio>

<div id="game-container">
    <!-- START SCREEN -->
    <div id="start-screen" class="screen">
        <h1>TENSE SLAYER<br>8-BIT EDITION</h1>
        <p>Master English tenses to defeat the boss!</p>
        <br>
        <p>SELECT DIFFICULTY:</p>
        <button onclick="startGame('easy')">EASY (30 HP)</button>
        <button onclick="startGame('medium')">MEDIUM (60 HP)</button>
        <button onclick="startGame('hard')">HARD (100 HP)</button>
    </div>

    <!-- BATTLE SCREEN -->
    <div id="battle-screen" class="screen hidden">
        <div class="stats-bar">
            <div style="width: 45%;">
                ENEMY HP
                <div class="hp-container"><div id="enemy-hp-fill" class="hp-fill"></div></div>
                <span id="enemy-hp-text">100/100</span>
            </div>
            <div style="width: 45%;">
                PLAYER HP
                <div class="hp-container"><div id="player-hp-fill" class="hp-fill"></div></div>
                <span id="player-hp-text">50/50</span>
            </div>
        </div>

        <div id="battle-log">BATTLE START!</div>
        <div id="dice-display"></div>

        <div id="question-area" class="question-card">
            <!-- Question content injected here -->
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="screen hidden">
        <h1 id="end-title">GAME OVER</h1>
        <p id="end-message"></p>
        <br>
        <button onclick="location.reload()">RETRY</button>
    </div>
</div>

<script>
    const questionBank = [
        { q: "She ___ (eat) breakfast every morning.", options: ["eats", "is eating", "ate"], correct: 0 },
        { q: "They ___ (watch) a movie right now.", options: ["watch", "are watching", "watched"], correct: 1 },
        { q: "I ___ (finish) my homework yesterday.", options: ["finish", "finishing", "finished"], correct: 2 },
        { q: "We ___ (live) here since 2010.", options: ["have lived", "live", "are living"], correct: 0 },
        { q: "He ___ (go) to Paris next summer.", options: ["goes", "will go", "went"], correct: 1 },
        { q: "Look! The cat ___ (climb) that tree.", options: ["climbs", "is climbing", "climbed"], correct: 1 },
        { q: "By the time we arrived, the train ___ (leave).", options: ["leaves", "has left", "had left"], correct: 2 },
        { q: "___ you ever ___ (be) to Japan?", options: ["Do/be", "Have/been", "Did/be"], correct: 1 },
        { q: "Water ___ (boil) at 100 degrees Celsius.", options: ["boils", "is boiling", "boiled"], correct: 0 },
        { q: "While I ___ (cook), the phone rang.", options: ["cook", "was cooking", "cooked"], correct: 1 },
        { q: "She ___ (not/see) him for two weeks.", options: ["didn't see", "hasn't seen", "doesn't see"], correct: 1 },
        { q: "I ___ (work) on this project all day.", options: ["have been working", "work", "am working"], correct: 0 },
        { q: "Tomorrow, I ___ (meet) my boss at 10 AM.", options: ["meet", "am meeting", "met"], correct: 1 },
        { q: "They ___ (play) football when it started to rain.", options: ["were playing", "are playing", "played"], correct: 0 },
        { q: "If it rains, we ___ (stay) at home.", options: ["stay", "will stay", "would stay"], correct: 1 },
        { q: "Last year, I ___ (travel) to Italy.", options: ["travel", "have traveled", "traveled"], correct: 2 },
        { q: "He ___ (always/lose) his keys!", options: ["always loses", "is always losing", "lost"], correct: 1 },
        { q: "How long ___ you ___ (study) English?", options: ["do/study", "have/been studying", "are/studying"], correct: 1 },
        { q: "The sun ___ (rise) in the east.", options: ["rises", "is rising", "rose"], correct: 0 },
        { q: "I ___ (read) that book three times already.", options: ["read", "have read", "am reading"], correct: 1 }
    ];

    let gameState = {
        playerHP: 50,
        maxPlayerHP: 50,
        enemyHP: 0,
        maxEnemyHP: 0,
        difficulty: '',
        questionsUsed: [],
        currentQuestion: null
    };

    // Audio references
    const bgm = document.getElementById('bgm');
    const sfxCorrect = document.getElementById('sfx-correct');
    const sfxWrong = document.getElementById('sfx-wrong');
    const container = document.getElementById('game-container');

    const screens = {
        start: document.getElementById('start-screen'),
        battle: document.getElementById('battle-screen'),
        end: document.getElementById('end-screen')
    };

    function showScreen(screenName) {
        Object.values(screens).forEach(s => s.classList.add('hidden'));
        screens[screenName].classList.remove('hidden');
    }

    function startGame(difficulty) {
        // Start Music
        bgm.volume = 0.3;
        bgm.play().catch(e => console.log("Audio autoplay prevented"));

        gameState.difficulty = difficulty;
        gameState.questionsUsed = [];
        gameState.playerHP = 50;
        
        if(difficulty === 'easy') gameState.maxEnemyHP = 30;
        else if(difficulty === 'medium') gameState.maxEnemyHP = 60;
        else gameState.maxEnemyHP = 100;

        gameState.enemyHP = gameState.maxEnemyHP;

        updateUI();
        showScreen('battle');
        loadNextQuestion();
    }

    function updateUI() {
        const enemyPercent = (gameState.enemyHP / gameState.maxEnemyHP) * 100;
        const playerPercent = (gameState.playerHP / gameState.maxPlayerHP) * 100;
        
        document.getElementById('enemy-hp-fill').style.width = `${Math.max(0, enemyPercent)}%`;
        document.getElementById('player-hp-fill').style.width = `${Math.max(0, playerPercent)}%`;
        document.getElementById('enemy-hp-text').innerText = `${Math.max(0, gameState.enemyHP)}/${gameState.maxEnemyHP}`;
        document.getElementById('player-hp-text').innerText = `${Math.max(0, gameState.playerHP)}/${gameState.maxPlayerHP}`;
    }

    function loadNextQuestion() {
        const available = questionBank.filter(q => !gameState.questionsUsed.includes(q.q));
        
        if (available.length === 0 || gameState.enemyHP <= 0 || gameState.playerHP <= 0) {
            checkEndGame();
            return;
        }

        // Pick one random question
        gameState.currentQuestion = available[Math.floor(Math.random() * available.length)];
        renderQuestion();
    }

    function renderQuestion() {
        const area = document.getElementById('question-area');
        area.innerHTML = '';
        document.getElementById('dice-display').innerText = '';
        document.getElementById('battle-log').innerText = "CHOOSE YOUR ANSWER!";

        const qText = document.createElement('div');
        qText.className = 'question-text';
        qText.innerText = gameState.currentQuestion.q;
        area.appendChild(qText);

        gameState.currentQuestion.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => handleAnswer(idx);
            area.appendChild(btn);
        });
    }

    function handleAnswer(selectedIdx) {
        const isCorrect = (selectedIdx === gameState.currentQuestion.correct);
        gameState.questionsUsed.push(gameState.currentQuestion.q);

        if (isCorrect) {
            // Roll Dice 6-10
            const roll = Math.floor(Math.random() * (10 - 6 + 1)) + 6;
            gameState.enemyHP -= roll;
            
            sfxCorrect.play();
            document.getElementById('battle-log').innerText = `HIT! ROLL: ${roll}`;
            document.getElementById('dice-display').innerText = `🎲 ${roll}`;
            document.getElementById('dice-display').style.color = "var(--accent)";
        } else {
            // Player takes damage
            gameState.playerHP -= 10;
            
            sfxWrong.play();
            document.getElementById('battle-log').innerText = `MISS! YOU TOOK 10 DMG`;
            document.getElementById('dice-display').innerText = `💥 -10`;
            document.getElementById('dice-display').style.color = "var(--danger)";
            
            // Visual shake effect
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 300);
        }

        updateUI();

        // Check game state
        if (gameState.enemyHP <= 0) {
            setTimeout(() => endGame(true), 600);
        } else if (gameState.playerHP <= 0) {
            setTimeout(() => endGame(false), 600);
        } else {
            // IMMEDIATE REPLACEMENT: Load next question after a tiny delay
            setTimeout(loadNextQuestion, 800);
        }
    }

    function checkEndGame() {
        if (gameState.enemyHP <= 0) endGame(true);
        else if (gameState.playerHP <= 0) endGame(false);
        else endGame(false); // Out of questions
    }

    function endGame(isVictory) {
        showScreen('end');
        const title = document.getElementById('end-title');
        const msg = document.getElementById('end-message');
        
        // Stop Music
        bgm.pause();

        if (isVictory) {
            title.innerText = "VICTORY!";
            title.style.color = "var(--accent)";
            msg.innerText = "BOSS DEFEATED!";
        } else {
            title.innerText = "DEFEAT...";
            title.style.color = "var(--danger)";
            msg.innerText = "YOU DIED...";
        }
    }
</script>

</body>
</html>
